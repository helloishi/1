<script>
(function(){
'use strict';

/* ---------- Rules (copy of 08-icebreaker/reference/rules.md, rules v1) ---------- */
const RULES_VERSION = 'rules v1';
const PROMISE_LINE = "Three months together. If the numbers haven't moved, the third month is on me.";
const PRICE_LINES = [
  'First step: a full check and the first fix, £99.',
  'Then £139 a month: AI visibility and guest surveys. Or £79 a month for the report only.',
  PROMISE_LINE,
  'Stop any month.'
];
const SIGN = {site:'zeroeight.app/start', wa:'+44 7586 533390'};
const RULES = `08 ICEBREAKER RULES v1

WHO
Kirill is the founder of 08 (zeroeight.app), a London-based startup. He visits independent places in London
(cafés, restaurants, bars, salons, barbers, hotels, shops, studios) and helps them in two ways:
1) AI visibility: what ChatGPT, Claude and other assistants tell guests about the place, and fixing the facts and
   descriptions those assistants read (Google profile, website, listings, menus, posts).
2) A short QR guest survey: how guests found the place ("asked AI" is one option), what they loved, what to improve.
   Every guest sees the same review link (Google or Tripadvisor), or there is no link at all.

VOICE
- First person singular: "I", Kirill. 08 is the name of the service. Never "we", "our team", "our manager", "platform".
- "I'm Kirill from 08, a London-based startup" is fine once, not at the start of the message.
- Plain British English. Short sentences, simple words: many owners are not native speakers.
- Reference line: "I can't control what AI says, nobody can."

TONE
- Warm, respectful, specific to this place. Write about them and their guests, not about technology.
- The first line is the finding. Politeness goes at the end.
- Problems are named gently and only if they sit on the surface (an AI mistake, a gap, a strength AI misses).
  No blame. Never scary: "invisible", "losing customers", "nobody will find you" are banned.

HONESTY
- Never promise rankings, guests or bookings.
- No numbers in a first message. Elsewhere only with source and date.
- AI answers change from day to day: say "when I asked ChatGPT on 11 November", never "ChatGPT says".
  An AI "mistake" needs two confirmations (two runs or two assistants); otherwise call it "worth checking".
- Never present sample or invented AI answers as real. If there is no AI evidence, make no claim about AI.
- Never claim clients or cases that do not exist ("I work with well-known places" is banned).
- Quotes from reviews, posts or the website are word for word from the inputs. Never a staff name inside a quote.
  Never use criticism from reviews.
- Competitors stay anonymous: "Café A", "Restaurant B".

BANNED
we, our team, our manager, platform, guarantee, promise, free (only "free check" is allowed), minutes
(say "a quick look"), the long dash, P.S., "collaboration", and "visibility" or "idea" in an email subject.

ONE CHEAP ASK PER MESSAGE (answerable in five seconds)
- owner: "Want me to send you the screenshots?"
- manager or staff: "Who's the best person to show this to?" plus a short paragraph they can forward
- social media person: "Want a few post ideas from your guests' own words?"
- events or bookings: "Which email is best for the details?"
- after a warm visit: "Can I drop it in on [day] after [time]?"

PRICE (never in a first message; second step or a meeting only, always with what they get and how to stop)
- First step: a full check and the first fix, £99.
- Then £139 a month (AI visibility and guest surveys), or £79 a month (report only). Stop any month.
- A discount only in exchange for a case study or a review, for the first five partners.
- Promise line: "${PROMISE_LINE}"
  The numbers: how often the same questions name the place, and facts corrected.

CHANNELS (text cascade: write the email first, compress it to WhatsApp, then to Instagram)
- Email: 80 to 120 words. Personal subject with a name or a visit detail. Ends with
  "If you'd rather not hear from me, just reply 'stop'." Signature: Kirill, 08, zeroeight.app/start,
  WhatsApp ${SIGN.wa}. One or two cards attached.
- WhatsApp: 40 to 60 words, two to five short lines, ends with "Kirill". One or two cards.
- Instagram: 20 to 40 words, one to three lines, ends with "Kirill". Text only until they accept the request.
  Part 2 is one or two lines to send with the card after they accept, like or reply.

FINDING TYPES
ai_error (a wrong fact in an AI answer), gap (the website or posts say X, AI does not know X),
hidden_strength (guests love X, AI never mentions it), new_place (a new opening AI does not know yet),
occasion (weddings, private hire, catering, delivery, gifts, events), languages (tourists ask in their language),
reviews (the place asks for reviews: the survey gives every guest the same easy invite).`;

/* ---------- Dictionaries ---------- */
const TYPES = [['cafe','Кафе'],['restaurant','Ресторан'],['bar','Бар'],['salon','Салон или барбер'],['hotel','Отель'],['shop','Магазин'],['studio','Студия или мастер-класс'],['events','Площадка для событий'],['other','Другое']];
const CHANNELS = [['instagram','Instagram'],['whatsapp','WhatsApp'],['email','Почта']];
const BASIS = [['','Выбери'],['given','Дали контакт лично'],['asked','Сами попросили подробности'],['public_company','Публичный адрес компании (Ltd)'],['none','Нет основания']];
const READERS = [['unknown','Не знаю'],['owner','Владелец'],['manager','Менеджер или персонал'],['smm','SMM'],['events','Мероприятия или брони']];
const KINDS = [['lost_letter','Письмо не дошло'],['follow_up','Тишина 3–4 дня'],['january','Январский список'],['live_lead','Живой лид']];
const FTYPES = {ai_error:'Ошибка ИИ',gap:'Пробел',hidden_strength:'Сильная сторона',new_place:'Новая точка',occasion:'Повод',languages:'Языки',reviews:'Отзывы'};
const RTYPES = {details:'Подробности',proposal:'Предложение',ask_owner:'Спросят владельца',later:'Позже',price:'Цена',not_sure:'Не уверены',no:'Нет',other:'Другое',none:'Без ответа'};
const TESTS = {
  subject:{label:'Стиль темы', values:['name','detail'], names:{name:'имя в теме',detail:'деталь визита'}},
  cards:{label:'Карточки', values:[1,2], names:{1:'1 карточка',2:'2 карточки'}},
  length:{label:'Длина', values:['short','shorter'], names:{short:'коротко',shorter:'ещё короче'}},
  images:{label:'Картинка', values:[0,1], names:{0:'без картинки',1:'с картинкой'}}
};
const CH_TESTS = {email:['subject','cards','length'], whatsapp:['cards','images','length'], instagram:['length']};
const DEFAULT_AB = {email:'subject', whatsapp:'cards', instagram:'length'};
const label = (list, v) => (list.find(x => x[0] === v) || [v, v || ''])[1];

/* ---------- State ---------- */
const S = {
  tab:'new', venues:[], stop:[], ab:{...DEFAULT_AB},
  loaded:false, loadNote:'', cap:{}, capReady:false, canWrite:true, imgMax:5,
  cur:null, step:1, busy:null, ctl:null,
  open:null, panel:null, pdata:{}, review:'', toastT:null, imgs:{}
};

/* ---------- Helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayISO = () => new Date().toISOString().slice(0,10);
const fmtDate = t => t ? new Date(t).toLocaleDateString('ru-RU',{day:'numeric',month:'short'}) : '';
const fmtLong = iso => { try { return new Date(iso + 'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'long'}); } catch(e) { return iso; } };
const nWords = s => String(s || '').trim().split(/\s+/).filter(Boolean).length;
const newId = () => 'v' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const clone = o => JSON.parse(JSON.stringify(o || null));
const DAY = 864e5;
function newDraft(){
  return {id:null, mode:'after_visit', kind:'lost_letter', name:'', area:'', type:'cafe', channel:'whatsapp', contact:'', basis:'', reader:'unknown',
    notes:'', siteText:'', history:'', aiDate:todayISO(), brief:null, aiQuestions:[], missing:[], ai:null, chosen:0, out:null, variant:null, sentChannel:null,
    shots:[], aiShots:[]};
}
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(S.toastT); S.toastT = setTimeout(() => { t.hidden = true; }, 3200);
}
async function copyText(txt){
  try { await navigator.clipboard.writeText(txt); toast('Скопировано'); }
  catch(e){ toast('Не удалось скопировать: выдели текст и скопируй вручную'); }
}

/* ---------- Local draft (per viewer convenience) ---------- */
const LS = '08ice.draft.v1';
let lsT = null;
function saveLocal(){
  clearTimeout(lsT);
  lsT = setTimeout(() => {
    try { const {shots, aiShots, ...rest} = S.cur; localStorage.setItem(LS, JSON.stringify({cur:rest, step:S.step})); } catch(e) {}
  }, 400);
}
function loadLocal(){
  try {
    const j = JSON.parse(localStorage.getItem(LS) || 'null');
    if (j && j.cur) { S.cur = {...newDraft(), ...j.cur, shots:[], aiShots:[]}; S.step = j.step || 1; return true; }
  } catch(e) {}
  return false;
}
function clearLocal(){ try { localStorage.removeItem(LS); } catch(e) {} }

/* ---------- Capabilities ---------- */
async function initCaps(){
  const C = window.claude;
  if (!C || !C.use) { S.capReady = true; S.loaded = true; render(); return; }
  const [sample, db, user, downloads] = await Promise.all(['sample','db','user','downloads'].map(n => C.use(n).catch(() => null)));
  S.cap = {sample, db, user, downloads};
  if (sample && sample.limits) {
    try { const lim = await sample.limits(); S.imgMax = lim && lim.images ? lim.images.maxCount : 0; } catch(e) { S.imgMax = 0; }
  }
  if (user && user.can) { try { const w = await user.can('data.write'); S.canWrite = (w !== false); } catch(e) {} }
  S.capReady = true;
  subscribe();
  render();
}
function dbErr(e){
  const c = e && e.code;
  if (c === 'quota_exceeded') return 'Журнал переполнен: удали старые места.';
  if (c === 'revoked') return 'Доступ к журналу закрыт в этом просмотре.';
  if (c === 'invalid_argument') return 'Нет прав на запись в журнал. Попроси владельца дать доступ Contributor.';
  return 'Журнал сейчас недоступен. Попробуй позже.';
}
function subscribe(){
  const db = S.cap.db;
  if (!db) { S.loaded = true; return; }
  const timer = setTimeout(() => { if (!S.loaded) { S.loadNote = 'Журнал пока не отвечает. Данные могут быть неполными.'; render(); } }, 10000);
  db.collection('venues').orderBy('updatedAt','desc').limit(500).onSnapshot(snap => {
    S.venues = snap.docs.map(d => ({...d.data(), id:d.id}));
    if (!snap.metadata.fromCache) { S.loaded = true; S.loadNote = ''; clearTimeout(timer); }
    softRender();
  }, e => { S.loaded = true; S.loadNote = dbErr(e); clearTimeout(timer); softRender(); });
  db.collection('stoplist').onSnapshot(s => { S.stop = s.docs.map(d => ({...d.data(), id:d.id})); softRender(); }, () => {});
  db.doc('settings/ab').onSnapshot(s => { if (s.exists) S.ab = {...DEFAULT_AB, ...s.data()}; softRender(); }, () => {});
}
const writes = {};
function queueWrite(path, fn){
  const p = (writes[path] || Promise.resolve()).then(fn, fn);
  writes[path] = p.catch(() => {});
  return p;
}
async function putVenue(v){
  v.updatedAt = Date.now();
  const i = S.venues.findIndex(x => x.id === v.id);
  if (i >= 0) S.venues[i] = v; else S.venues.unshift(v);
  if (!S.cap.db) return;
  const body = clone(v);
  try { await queueWrite('venues/' + v.id, () => S.cap.db.doc('venues/' + v.id).set(body)); }
  catch(e) { toast(dbErr(e)); }
}
const stopId = c => String(c || '').toLowerCase().replace(/[^a-z0-9_\-.~:@+]/g, '').slice(0, 180) || 'x';
function isStopped(contact){
  const id = stopId(contact);
  return !!contact && S.stop.some(s => s.id === id);
}
async function addStop(contact){
  const c = String(contact || '').trim(); if (!c) return;
  const id = stopId(c);
  if (!S.stop.some(s => s.id === id)) S.stop.push({id, contact:c, at:Date.now()});
  if (S.cap.db) { try { await queueWrite('stoplist/' + id, () => S.cap.db.doc('stoplist/' + id).set({contact:c, at:Date.now()})); } catch(e) { toast(dbErr(e)); } }
  toast('Добавлено в стоп-лист');
}

/* ---------- Claude ---------- */
function errCopy(e){

async function shrink(file){
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(b => r(b || file), 'image/jpeg', 0.85));
  } catch(e) { return file; }
}
async function ask(label, prompt, files, tier){
  const sample = S.cap.sample;
  if (!sample) { toast('Claude доступен, когда страница открыта на claude.ai.'); return null; }
  let imgs = [];
  if (files && files.length) {
    if (!S.imgMax) { toast('В этом просмотре нельзя отправлять картинки: скриншоты пропущены.'); }
    else {

      if (files.length > S.imgMax) toast('Отправлю первые ' + S.imgMax + ' скриншотов из ' + files.length + '.');
      imgs = await Promise.all(use.map(f => shrink(f.file || f)));
    }
  }
  S.ctl = new AbortController();
  S.busy = {label, chars:0};
  render();
  try {
    const opts = {signal:S.ctl.signal, modelTier:tier || 'default', cache:false, onText:({text}) => { if (S.busy) { S.busy.chars = text.length; updBusy(); } }};
    if (imgs.length) opts.images = imgs;
    return await sample.json(prompt, opts);
  } catch(e) {
    if (e && e.code !== 'cancelled') toast(errCopy(e));

  } finally {
    S.busy = null; S.ctl = null; render();
  }
}

function checkTexts(v, texts, firstTouch, noLengths){
  const out = [];
  const add = (lvl, msg) => out.push({lvl, msg});
  if (!texts) return out;
  const chunks = {email:(texts.email ? (texts.email.subject || '') + '\n' + (texts.email.body || '') : ''), whatsapp:(texts.whatsapp || {}).body || '',
    instagram:((texts.instagram || {}).part1 || '') + '\n' + ((texts.instagram || {}).part2 || ''), forward:(texts.forward || {}).body || ''};
  for (const [ch, txt] of Object.entries(chunks)) {
    if (!txt.trim()) continue;
    const nm = {email:'Почта', whatsapp:'WhatsApp', instagram:'Instagram', forward:'Абзац для пересылки'}[ch];
    for (const [re, msg] of BANNED) if (re.test(txt)) add('bad', nm + ': ' + msg);
    if (firstTouch && /£\s?\d/.test(txt)) add('bad', nm + ': цена в первом сообщении');
    if (firstTouch && /\d+\s?%|\b\d+([.,]\d+)?\s?(million|billion|m)\b/i.test(txt)) add('bad', nm + ': цифры в первом сообщении');
  }
  if (texts.email && /collaboration|visibility|\bidea\b/i.test(texts.email.subject || '')) add('warn', 'Тема письма похожа на рассылку: сделай её личной');
  const wc = {email:nWords((texts.email || {}).body), whatsapp:nWords((texts.whatsapp || {}).body), instagram:nWords((texts.instagram || {}).part1)};
  for (const ch of (noLengths ? [] : ['email','whatsapp','instagram'])) {
    const [lo, hi] = LIM[ch];
    if (wc[ch] && (wc[ch] < lo * 0.7 || wc[ch] > hi * 1.15)) add('warn', label(CHANNELS, ch) + ': ' + wc[ch] + ' слов, цель ' + lo + '–' + hi);
  }
  if (/https?:\/\/|zeroeight\.app/i.test((texts.instagram || {}).part1 || '')) add('warn', 'Instagram: ссылка в первой части может не пройти');
  const staff = ((v.brief || {}).staff_names || []).filter(Boolean);
  const all = Object.values(chunks).join('\n');
  for (const s of staff) {
    const re = new RegExp('["“][^"”]*\\b' + s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b[^"”]*["”]', 'i');
    if (re.test(all)) add('bad', 'Имя сотрудника «' + s + '» внутри цитаты');
  }
  const src = sourceText(v);
  const qs = [...all.matchAll(/["“]([^"”]{12,})["”]/g)].map(m => m[1]);
  for (const q of qs) {
    const norm = q.toLowerCase().replace(/\s+/g, ' ').trim();
    if (src && src.includes(norm)) add('ok', 'Цитата найдена во входных данных: «' + q.slice(0, 60) + '»');
    else add('info', 'Сверь цитату по скриншоту: «' + q.slice(0, 60) + '»');
  }
  if (!out.some(c => c.lvl === 'bad' || c.lvl === 'warn')) add('ok', 'Правила соблюдены');
  return out;
}

function countSent(channel, test, value){
  let n = 0;
  for (const v of S.venues) for (const t of (v.touches || [])) if (t.channel === channel && t.variant && t.variant.test === test && String(t.variant.value) === String(value)) n++;

function pickVariant(channel, segment){
  const test = S.ab[channel] || DEFAULT_AB[channel];
  const vals = (TESTS[test] || {values:[]}).values;
  const counts = vals.map(x => countSent(channel, test, x));
  const min = Math.min(...counts);
  const cands = vals.filter((x, i) => counts[i] === min);
  const total = counts.reduce((a, b) => a + b, 0);
  const value = cands[total % cands.length];
  let cards = 1;
  if (test === 'cards') cards = value;
  if (test === 'images') cards = value;
  if (channel === 'instagram') cards = 1;
  return {segment:segment || null, test, value, cards};
}

function wrapLines(g, text, maxW){
  const words = String(text || '').split(/\s+/).filter(Boolean); const lines = []; let line = '';
  for (const w of words) { const t = line ? line + ' ' + w : w; if (g.measureText(t).width <= maxW || !line) line = t; else { lines.push(line); line = w; } }
  if (line) lines.push(line); return lines;
}
function para(g, text, x, y, maxW, lh, maxLines){
  let lines = wrapLines(g, text, maxW);
  if (maxLines && lines.length > maxLines) { lines = lines.slice(0, maxLines); lines[maxLines - 1] = lines[maxLines - 1].replace(/\s*\S*$/, '') + '…'; }
  for (const l of lines) { g.fillText(l, x, y); y += lh; }
  return y;
}

/* ---------- Today ---------- */
function todayItems(){
  const now = Date.now(), items = [];
  for (const v of S.venues) {
    if (v.status === 'stopped') continue;
    const ts = v.touches || [];
    ts.forEach((t, i) => {
      const age = now - (t.at || 0);
      if (t.channel === 'email' && t.delivered == null && age > 5 * 60e3 && age < 7 * DAY) items.push({v, i, kind:'delivery', pri:1});
      if (t.channel === 'instagram' && !t.ig_part2 && t.delivered !== false && !t.replied && age < 14 * DAY) items.push({v, i, kind:'ig2', pri:2});
      if (!t.result_at && !t.replied && age > 2 * DAY && age <= 3 * DAY) items.push({v, i, kind:'result', pri:3});
    });
    const li = ts.length - 1, last = ts[li];
    if (last && !last.replied && !last.followed && now - (last.at || 0) > 3 * DAY && now - (last.at || 0) < 30 * DAY) items.push({v, i:li, kind:'follow', pri:4});
    if (v.next_at && v.next_at <= now + DAY) items.push({v, kind:'next', pri:5});
  }
  return items.sort((a, b) => a.pri - b.pri);
}

/* ---------- Actions ---------- */
function curToVenue(){
  const c = S.cur;
  const prev = c.id ? S.venues.find(v => v.id === c.id) : null;
  const v = prev ? clone(prev) : {id:newId(), createdAt:Date.now(), touches:[], status:'draft'};
  Object.assign(v, {name:c.name, area:c.area, type:c.type, channel:c.channel, contact:c.contact, basis:c.basis, reader:c.reader,
    notes:cut(c.notes, 6000), siteText:cut(c.siteText, 12000), history:cut(c.history, 3000), brief:c.brief, aiQuestions:c.aiQuestions, aiDate:c.aiDate,
    ai:c.ai, chosen:c.chosen, out:c.out, variant:c.variant, segment:c.segment || (c.brief && c.brief.segment) || null});
  c.id = v.id;
  return v;
}
async function actBrief(){
  const c = S.cur;
  const r = await ask('Разбираю место', promptBrief(c), c.shots, 'default');
  if (!r || !r.brief) return;
  c.brief = r.brief; c.aiQuestions = (r.ai_questions || []).filter(q => q && q.q); c.missing = r.missing_ru || [];
  c.segment = r.brief.segment === 'A' ? 'A' : 'B';
  S.step = 2; saveLocal(); await putVenue(curToVenue()); render();
}
async function actFinding(noai){
  const c = S.cur;
  if (noai) c.aiShots = [];
  c.variant = pickVariant(c.channel, c.segment);
  const r = await ask('Ищу находку и пишу тексты', promptFinding(c), c.aiShots, 'complex');
  if (!r || !r.findings) return;
  c.ai = {ai_evidence:r.ai_evidence || [], findings:r.findings || [], entry_ru:r.entry_ru || ''};
  c.chosen = Math.min(Math.max(0, r.chosen | 0), (r.findings || []).length - 1);
  c.out = {ask:r.ask, texts:r.texts, texts_ru:r.texts_ru, cards:(r.cards || []).slice(0, c.variant.cards || 1), visit_card:r.visit_card, reader_check:r.reader_check, chosenAt:c.chosen};
  S.step = 3; saveLocal(); await putVenue(curToVenue()); render();
  buildCards(c, c.out, 'n').then(x => { S.pdata.newCards = x; render(); });
}
async function actRewrite(){
  const c = S.cur, f = c.ai.findings[c.chosen];
  const r = await ask('Переписываю под выбранную находку', promptRewrite(c, f), [], 'default');
  if (!r || !r.texts) return;
  c.out = {ask:r.ask, texts:r.texts, texts_ru:r.texts_ru, cards:(r.cards || []).slice(0, (c.variant || {}).cards || 1), visit_card:r.visit_card, reader_check:r.reader_check, chosenAt:c.chosen};
  S.step = 4; saveLocal(); await putVenue(curToVenue()); render();
  buildCards(c, c.out, 'n').then(x => { S.pdata.newCards = x; render(); });
}

  const v = curToVenue();
  const vr = c.mode === 'after_visit' && c.variant && ch === c.channel ? c.variant : {segment:c.segment || null, test:null, value:null};
  const f = c.ai && c.ai.findings ? c.ai.findings[c.chosen] : null;
  v.touches = (v.touches || []).concat([{at:Date.now(), mode:c.mode === 'recontact' ? 'recontact' : 'after_visit', channel:ch, variant:vr,
    finding_type:f ? f.type : null, ask:(c.out || {}).ask || '', text:sentText(c.out, ch), delivered:null, read:null, ig_part2:false, replied:false}]);
  v.status = 'sent';
  await putVenue(v);
  toast('Записано в журнал');
  clearLocal(); S.cur = newDraft(); S.step = 1; S.pdata.newCards = []; S.pdata.newCh = null; S.tab = 'today'; render();
}
async function mark(id, i, k){
  const v0 = S.venues.find(x => x.id === id); if (!v0) return;
  const v = clone(v0); const t = v.touches[i]; if (!t) return;
  const now = Date.now();
  if (k === 'delivered') t.delivered = true;
  if (k === 'undelivered') { t.delivered = false; v.next = 'Письмо не дошло: напиши в другой канал'; v.next_at = now; }
  if (k === 'read') { t.read = true; if (t.delivered == null) t.delivered = true; }
  if (k === 'ig2') t.ig_part2 = true;
  if (k === 'replied') { t.replied = true; t.delivered = true; t.result_at = now; v.status = 'replied'; }
  if (k === 'meeting') { t.meeting = true; v.status = 'meeting'; }
  if (k === 'paid') { t.paid = true; v.status = 'paid'; }
  if (k === 'silence') t.result_at = now;
  await putVenue(v); render();
}
async function actReply(v0){
  const v = clone(v0);
  const files = S.pdata.replyShots || [];
  const r = await ask('Разбираю ответ', promptReply(v, S.pdata.replyText || '', files.length), files, 'complex');
  if (!r || !r.next_message) return;
  if (!r.next_message.channel) r.next_message.channel = v.channel;
  S.pdata.replyOut = r;
  const li = (v.touches || []).length - 1;
  if (li >= 0) { const t = v.touches[li]; t.replied = true; t.delivered = true; t.result_at = Date.now(); t.reply = cut(S.pdata.replyText, 2000) || t.reply || ''; t.reply_type = r.reply_type; }
  v.status = 'replied';
  if (r.next_date_days) { v.next_at = Date.now() + r.next_date_days * DAY; v.next = r.next_step_ru || ''; }
  await putVenue(v);
  render();
  buildCards(v, {one_pager:r.one_pager || null}, 'r').then(x => { S.pdata.replyCards = x; render(); });
}
async function actRecon(v0){
  const v = clone(v0); const kind = S.pdata.kind || 'follow_up';
  const r = await ask('Готовлю повторный контакт', promptRecontact(v, kind, S.pdata.reconNotes || ''), [], 'default');
  if (!r || !r.texts) return;
  S.pdata.reconOut = r; S.pdata.reconCh = v.channel;
  render();
  buildCards(v, {cards:(r.cards || []).slice(0, 1)}, 'rc').then(x => { S.pdata.reconCards = x; render(); });
}
async function actSentFrom(v0, mode, ch, text, extra){
  const v = clone(v0);
  if (mode === 'recontact' && v.touches && v.touches.length) v.touches[v.touches.length - 1].followed = true;
  v.touches = (v.touches || []).concat([Object.assign({at:Date.now(), mode, channel:ch, variant:{segment:v.segment || null, test:null, value:null}, text, delivered:null, read:null, ig_part2:false, replied:false}, extra || {})]);
  v.status = 'sent';
  await putVenue(v);
  S.panel = null; S.pdata.replyOut = null; S.pdata.reconOut = null; toast('Записано в журнал'); render();
}
async function actResult(v0){
  const v = clone(v0); const li = (v.touches || []).length - 1; if (li < 0) return;
  const files = S.pdata.resultShots || [];
  if (!files.length) { toast('Добавь скриншот переписки'); return; }
  const r = await ask('Читаю результат', promptResult(v, v.touches[li]), files, 'default');
  if (!r) return;
  const t = v.touches[li];
  if (r.delivered != null) t.delivered = r.delivered;
  if (r.read != null) t.read = r.read;
  if (r.ig_accepted === true && t.channel === 'instagram') t.ig_accepted = true;
  if (r.replied) { t.replied = true; t.reply = cut(r.reply, 2000); t.reply_type = r.reply_type; v.status = 'replied'; }
  t.result_at = Date.now();
  await putVenue(v);
  S.panel = null; toast(r.note_ru || 'Результат записан'); render();
}
async function actWeekly(){
  const st = abStats();
  const replies = [];
  for (const v of S.venues) for (const t of (v.touches || [])) if (t.replied) replies.push({place:v.name, channel:t.channel, variant:t.variant, finding:t.finding_type, ask:t.ask, reply:cut(t.reply, 300), segment:v.segment});
  const prompt = `Weekly A/B review for Kirill (08), in Russian. Be honest about small numbers: under 10 sends per variant is
"мало данных", never claim a winner on tiny samples.

ACTIVE TESTS: ${JSON.stringify(S.ab)}
COUNTS BY CHANNEL AND VARIANT (sent, delivered, read, replied, meeting, paid): ${JSON.stringify(st.ch)}
COUNTS BY SEGMENT (A: plan ahead and spend a lot; B: as usual): ${JSON.stringify(st.seg)}
REPLIES WORD FOR WORD: ${JSON.stringify(replies).slice(0, 12000)}

Write plain text with these short headings: Что сработало (с цифрами); Насколько можно верить; Лучшие формулировки
(цитаты); Что поменять в плейбуке; Следующий тест. Under 250 words. No markdown symbols except line breaks.`;
  const sample = S.cap.sample;
  if (!sample) { toast('Claude доступен, когда страница открыта на claude.ai.'); return; }
  S.ctl = new AbortController(); S.busy = {label:'Готовлю недельный разбор', chars:0}; render();
  try {
    const {text} = await sample(prompt, {signal:S.ctl.signal, cache:false, onText:({text}) => { if (S.busy) { S.busy.chars = text.length; updBusy(); } }});
    S.review = text;
    if (S.cap.db) { const wk = new Date(); const id = wk.getFullYear() + '-' + String(wk.getMonth() + 1).padStart(2, '0') + '-' + String(wk.getDate()).padStart(2, '0'); queueWrite('reviews/' + id, () => S.cap.db.doc('reviews/' + id).set({text, at:Date.now()})).catch(() => {}); }
  } catch(e) { if (e && e.code !== 'cancelled') toast(errCopy(e)); }
  finally { S.busy = null; S.ctl = null; render(); }
}
function csv(){
  const cols = ['place','area','type','segment','channel','contact','basis','reader','date','mode','test','variant','finding','ask','delivered','read','replied','reply_type','reply','meeting','paid','status','next','next_at'];
  const q = x => '"' + String(x == null ? '' : x).replace(/"/g, '""') + '"';
  const lines = [cols.join(',')];
  for (const v of S.venues) {
    const ts = (v.touches && v.touches.length) ? v.touches : [{}];
    for (const t of ts) lines.push([v.name, v.area, label(TYPES, v.type), v.segment, t.channel, v.contact, label(BASIS, v.basis), label(READERS, v.reader),
      t.at ? new Date(t.at).toISOString().slice(0, 10) : '', t.mode, t.variant && t.variant.test, t.variant && t.variant.value, t.finding_type, t.ask,
      t.delivered, t.read, t.replied, t.reply_type, t.reply, t.meeting, t.paid, v.status, v.next, v.next_at ? new Date(v.next_at).toISOString().slice(0, 10) : ''].map(q).join(','));
  }
  saveFile('icebreaker-journal-' + todayISO() + '.csv', lines.join('\n'));
}
function getOut(key){
  const c = S.cur;
  const [a, b, d] = key.split('.');
  if (a === 'r') { const r = S.pdata.replyOut || {}; return b === 'subject' ? (r.next_message || {}).subject : b === 'forward' ? r.forward : (r.next_message || {}).body; }
  if (a === 'rc') { const t = ((S.pdata.reconOut || {}).texts || {})[b] || {}; return t[d]; }
  const t = ((c.out || {}).texts || {})[a] || {}; return t[b];
}
function setOut(key, val){
  const c = S.cur;
  const [a, b, d] = key.split('.');
  if (a === 'r') { const r = S.pdata.replyOut; if (!r) return; if (b === 'subject') r.next_message.subject = val; else if (b === 'forward') r.forward = val; else r.next_message.body = val; return; }
  if (a === 'rc') { const r = S.pdata.reconOut; if (!r || !r.texts || !r.texts[b]) return; r.texts[b][d] = val; return; }
  if (c.out && c.out.texts && c.out.texts[a]) { c.out.texts[a][b] = val; saveLocal(); }
}

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, v = el.dataset.v;
  if (act === 'tab') { S.tab = v; S.open = null; S.panel = null; render(); window.scrollTo(0, 0); }
  else if (act === 'stop') { if (S.ctl) S.ctl.abort(); }
  else if (act === 'setf') { S.cur[el.dataset.f] = v; saveLocal(); render(); }
  else if (act === 'step' || act === 'toStep') { S.step = +v; saveLocal(); render(); window.scrollTo(0, 0); }
  else if (act === 'reset') { clearLocal(); S.cur = newDraft(); S.step = 1; S.pdata.newCards = []; S.pdata.newCh = null; render(); }
  else if (act === 'brief') actBrief();
  else if (act === 'finding') actFinding(v === 'noai');
  else if (act === 'rewrite') actRewrite();
  else if (act === 'recontactNew') actRecontactNew();
  else if (act === 'choose') { S.cur.chosen = +v; saveLocal(); render(); }
  else if (act === 'copyQs') copyText((S.cur.aiQuestions || []).map(q => q.q).join('\n'));
  else if (act === 'copyOut') { const ta = document.querySelector(`[data-out="${CSS.escape(v)}"]`); copyText(ta ? ta.value : (getOut(v) || '')); }
  else if (act === 'newCh') { S.pdata.newCh = v; render(); }
  else if (act === 'reconCh') { S.pdata.reconCh = v; render(); }
  else if (act === 'saveImg') { const im = S.imgs[v]; if (im) saveFile(el.dataset.n, im.blob); }
  else if (act === 'sent') actSent();
  else if (act === 'openV') { S.tab = 'places'; S.open = v; S.panel = null; S.pdata.replyOut = null; S.pdata.reconOut = null; render(); window.scrollTo(0, 0); }
  else if (act === 'back') { S.open = null; S.panel = null; render(); }
  else if (act === 'panel') { S.panel = S.panel === v ? null : v; render(); }
  else if (act === 'pfilter') { S.pdata.filter = v; render(); }
  else if (act === 'mark') mark(v, +el.dataset.i, el.dataset.k);
  else if (act === 'doReply') { const vv = S.venues.find(x => x.id === S.open); if (vv) actReply(vv); }
  else if (act === 'doRecon') { const vv = S.venues.find(x => x.id === S.open); if (vv) actRecon(vv); }
  else if (act === 'doResult') { const vv = S.venues.find(x => x.id === S.open); if (vv) actResult(vv); }
  else if (act === 'sentReply') { const vv = S.venues.find(x => x.id === S.open); const r = S.pdata.replyOut; if (vv && r) actSentFrom(vv, 'reply', r.next_message.channel || vv.channel, (r.next_message.subject ? 'Subject: ' + r.next_message.subject + '\n\n' : '') + r.next_message.body); }
  else if (act === 'sentRecon') { const vv = S.venues.find(x => x.id === S.open); const r = S.pdata.reconOut; const ch = S.pdata.reconCh || (vv && vv.channel); if (vv && r) actSentFrom(vv, 'recontact', ch, sentText(r, ch), {ask:r.ask}); }
  else if (act === 'followUp') { S.tab = 'places'; S.open = v; S.panel = 'recon'; S.pdata.kind = 'follow_up'; S.pdata.reconOut = null; render(); }
  else if (act === 'stopV') { const vv = S.venues.find(x => x.id === v); if (vv) { const c = clone(vv); c.status = 'stopped'; if (c.contact) await addStop(c.contact); await putVenue(c); render(); } }
  else if (act === 'addStop') { const inp = $('#stopIn'); if (inp && inp.value.trim()) { await addStop(inp.value); inp.value = ''; render(); } }
  else if (act === 'csv') csv();
  else if (act === 'weekly') actWeekly();
});
document.addEventListener('keydown', e => {
  const el = e.target.closest && e.target.closest('[role="radio"][data-act="choose"]');
  if (el && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); el.click(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.f && S.cur) { S.cur[t.dataset.f] = t.value; saveLocal(); if (t.dataset.f === 'contact' || t.dataset.f === 'name') { const btn = document.querySelector('[data-act="brief"],[data-act="recontactNew"]'); if (btn) btn.disabled = !!S.busy || !S.cur.basis || S.cur.basis === 'none' || isStopped(S.cur.contact) || !S.cur.name; } }
  if (t.dataset.pf) { S.pdata[t.dataset.pf] = t.value; if (t.dataset.pf === 'q') { clearTimeout(S.qT); S.qT = setTimeout(() => { const pos = t.selectionStart; render(); requestAnimationFrame(() => { const n = document.querySelector('[data-pf="q"]'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch(err) {} } }); }, 300); } }
  if (t.dataset.out) setOut(t.dataset.out, t.value);
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.tagName === 'SELECT' && t.dataset.f && S.cur) { S.cur[t.dataset.f] = t.value; saveLocal(); render(); }
  if (t.dataset.files && t.files) { const key = t.dataset.files; (S.cur[key] || []).forEach(f => URL.revokeObjectURL(f.url)); S.cur[key] = [...t.files].map(f => ({file:f, url:URL.createObjectURL(f)})); render(); }
  if (t.dataset.pfiles && t.files) { S.pdata[t.dataset.pfiles] = [...t.files]; toast('Скриншотов: ' + t.files.length); }
  if (t.dataset.ab) { S.ab = {...S.ab, [t.dataset.ab]:t.value}; if (S.cap.db) { try { await queueWrite('settings/ab', () => S.cap.db.doc('settings/ab').set(clone(S.ab))); } catch(err) { toast(dbErr(err)); } } render(); }
});

/* ---------- Boot ---------- */
S.cur = newDraft();
if (loadLocal() && (S.cur.name || S.cur.notes)) S.tab = 'new';
render();
initCaps();
})();
</script>
